spring.application.name=api-escola

# ---------- Conexão com o PostgreSQL ----------
# Crie o banco antes de rodar:  CREATE DATABASE escola;
spring.datasource.url=jdbc:postgresql://localhost:5432/escola
spring.datasource.username=postgres
spring.datasource.password=sua_senha
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- Hibernate / JPA ----------
# update: cria e atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
# mostra no console os comandos SQL executados
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# garante acentuação correta nas respostas de texto (ex.: "é" no endpoint /alunos/ra)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# mostra a mensagem da exceção no corpo do erro (ex.: "Aluno com id 99 não encontrado")
server.error.include-message=always
